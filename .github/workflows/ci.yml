name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Integration tests skip themselves when YORKIE_TEST_RPC_ADDR is unset.
      - run: cargo test --workspace
      - run: cargo doc -p yorkie --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    env:
      YORKIE_TEST_RPC_ADDR: http://localhost:8080
      # Tag without a "v" prefix, as published to Docker Hub by `make docker`.
      YORKIE_IMAGE: yorkieteam/yorkie:0.7.24
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The image's entrypoint is `yorkie` with no default command, and a
      # `services:` container cannot pass arguments, so start it with
      # `docker run`. Without a MongoDB URI the server uses an in-memory DB.
      - name: Start Yorkie server
        run: |
          docker run -d --name yorkie -p 8080:8080 -p 8081:8081 "$YORKIE_IMAGE" \
            server --rpc-port 8080 --profiling-port 8081
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null "$YORKIE_TEST_RPC_ADDR"; then exit 0; fi
            sleep 1
          done
          docker logs yorkie
          exit 1
      - run: cargo test -p yorkie
      - name: Server logs
        if: failure()
        run: docker logs yorkie
