[package]
name = "yorkie-client"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
yorkie-core = { path = "../yorkie-core" }
yorkie-protocol = { path = "../yorkie-protocol" }
async-trait = "0.1"
base64 = "0.22"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
prost = "0.14.3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
